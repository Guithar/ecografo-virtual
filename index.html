<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fistulab · Simulador de punción ecoguiada de la FAV</title>
    <meta name="description" content="Simulador gratuito, en el navegador, para aprender la punción ecoguiada de la fístula arteriovenosa (FAV) para hemodiálisis: ecografía en tiempo real, abordaje longitudinal y transversal, Doppler y evaluación según las guías." />
    <link rel="canonical" href="https://fistulab.com/" />
    <meta name="theme-color" content="#0b1117" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fistulab" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://fistulab.com/" />
    <meta property="og:title" content="Fistulab · Simulador de punción ecoguiada de la FAV" />
    <meta property="og:description" content="Aprende a puncionar la fístula arteriovenosa con ecografía, sin equipo: imagen en tiempo real, abordaje longitudinal y transversal, Doppler y evaluación. Gratis y en el navegador." />
    <meta property="og:image" content="https://fistulab.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fistulab: imagen ecográfica simulada con la aguja dentro de la fístula, junto al brazo en 3D" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fistulab",
        "alternateName": "Fistulab · Simulador de punción ecoguiada de la FAV",
        "url": "https://fistulab.com/",
        "description": "Simulador gratuito, en el navegador, para aprender la punción ecoguiada de la fístula arteriovenosa (FAV) para hemodiálisis.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Cualquiera (navegador con WebGL2)",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "audience": { "@type": "Audience", "audienceType": "Enfermería y medicina de unidades de hemodiálisis" },
        "license": "https://opensource.org/licenses/MIT",
        "sameAs": ["https://github.com/Guithar/ecografo-virtual", "https://ko-fi.com/fistulab"]
      }
    </script>
  </head>
  <body>
    <noscript><p class="noscript">Fistulab necesita JavaScript y un navegador con WebGL2 (Chrome, Edge, Firefox o Safari recientes).</p></noscript>
    <canvas id="gl"></canvas>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loadingText">Preparando el simulador…</div>
    </div>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
            <defs>
              <linearGradient id="flHaz" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3fc1c9" stop-opacity=".62" />
                <stop offset="1" stop-color="#3fc1c9" stop-opacity=".1" />
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="14" fill="#12303a" />
            <rect x="16" y="15" width="32" height="40" fill="url(#flHaz)" />
            <rect x="13" y="8" width="38" height="8" rx="3" fill="#dfe7ec" />
            <circle cx="35" cy="37" r="9" fill="#071015" stroke="#9fe7ff" stroke-width="3.2" />
            <path d="M6 22 33.5 36.2" stroke="#fff" stroke-width="3" stroke-linecap="round" />
          </svg>
          <div>
            <div class="title">Fistu<span>lab</span></div>
            <div class="subtitle">Punción ecoguiada de la FAV</div>
          </div>
        </div>
        <div class="case-sel">
          <label for="caseSelect">Caso</label>
          <select id="caseSelect"></select>
          <span id="caseDiff" class="diff"></span>
        </div>
        <nav id="modeTabs">
          <button data-mode="explore" class="active" title="Explorar libremente la anatomía y el ecógrafo">Exploración</button>
          <button data-mode="cannulate" title="Punción ecoguiada con métricas">Punción</button>
          <button data-mode="room" title="Posición del paciente, operador y pantalla">Sala y ergonomía</button>
          <button data-mode="learn" title="Lecciones guiadas">Aprendizaje</button>
        </nav>
        <div class="top-actions">
          <select id="armSide" title="Brazo del acceso">
            <option value="left">Brazo izquierdo</option>
            <option value="right">Brazo derecho</option>
          </select>
          <select id="quality" title="Calidad de simulación">
            <option value="alta">Calidad alta</option>
            <option value="media" selected>Calidad media</option>
            <option value="baja">Calidad baja</option>
          </select>
          <button id="mobileInfo" style="display:none" title="Mostrar/ocultar la información del caso y las métricas">Info</button>
          <button id="btnReport" title="Informe de la sesión">Informe</button>
          <button id="btnHelp" title="Ayuda, atajos de teclado y acerca de Fistulab">Ayuda</button>
          <a id="btnKofi" class="kofi" href="https://ko-fi.com/fistulab" target="_blank" rel="noopener" title="Fistulab es gratuito y sin publicidad. Si te resulta útil, apóyalo en Ko-fi (se abre en otra pestaña)">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9h12v4.5a5.5 5.5 0 0 1-5.5 5.5h-1A5.5 5.5 0 0 1 4 13.5z" />
              <path d="M16 10.5h1.6a2.6 2.6 0 0 1 0 5.2H15.7" />
              <path d="M10 16.4 7.8 14.2a1.45 1.45 0 0 1 2.2-1.9 1.45 1.45 0 0 1 2.2 1.9z" fill="currentColor" stroke="none" />
            </svg>
            <span>Apoyar</span>
          </a>
        </div>
      </header>

      <main id="grid">
        <section id="pane3d" class="pane">
          <div id="view3d" class="gl-view" tabindex="0"></div>
          <div class="toolbar3d">
            <div class="btn-row" id="camPresets">
              <button data-cam="procedimiento" title="Vista del procedimiento">Procedimiento</button>
              <button data-cam="superior" title="Desde arriba">Superior</button>
              <button data-cam="lateral" title="Lateral">Lateral</button>
              <button data-cam="corte" title="Perpendicular al plano de corte">Corte</button>
              <button data-cam="operador" title="Lo que ve el operador">Operador</button>
              <button data-cam="sala" title="Vista general de la sala">Sala</button>
            </div>
            <div class="btn-row" id="layerRow">
              <label class="sl" title="Transparencia de la piel">Piel <input type="range" id="optSkin" min="0" max="1" step="0.01" /></label>
              <label class="chk"><input type="checkbox" id="optVessels" checked />Vasos</label>
              <label class="chk"><input type="checkbox" id="optNerves" checked />Nervios</label>
              <label class="chk"><input type="checkbox" id="optBones" checked />Huesos</label>
              <label class="chk"><input type="checkbox" id="optTendons" checked />Tendones</label>
              <label class="chk"><input type="checkbox" id="optMuscle" />Músculo</label>
              <label class="chk"><input type="checkbox" id="optFlow" />Flujo</label>
              <label class="chk" title="La cámara acompaña a la sonda"><input type="checkbox" id="optFollow" checked />Seguir sonda</label>
              <select id="optPlane" title="Contenido del plano de exploración en 3D">
                <option value="us">Plano: ecografía</option>
                <option value="anat">Plano: anatomía</option>
                <option value="none">Plano: oculto</option>
              </select>
            </div>
          </div>
          <div id="probeHud" class="hud"></div>
          <div id="needleHud" class="hud hud-right hidden"></div>
          <div id="toasts"></div>
          <div class="pane-hint" id="hint3d">Arrastra la <b>sonda</b> sobre la piel para moverla · arrastra el fondo para girar la cámara · rueda para acercar</div>
        </section>

        <section id="paneMonitor" class="pane monitor">
          <div class="mon-top">
            <span class="mon-brand">Fistu<b>lab</b></span>
            <span id="monCase" class="mon-case"></span>
            <span class="grow"></span>
            <span class="mon-probe">L12-5 · 38 mm</span>
            <span id="monClock" class="mon-clock"></span>
          </div>
          <div class="mon-body">
            <div id="usView" class="gl-view us-view">
              <svg id="usSvg"></svg>
              <div id="usParams"></div>
            </div>
            <div id="specView" class="spec hidden">
              <canvas id="specCanvas"></canvas>
            </div>
            <div id="specMeas" class="spec-meas"></div>
          </div>
          <div id="cineBar" class="cine hidden">
            <span>Cine</span>
            <button id="cinePrev" title="Fotograma anterior (,)">◀</button>
            <input type="range" id="cineSlider" min="0" max="63" step="1" />
            <button id="cineNext" title="Fotograma siguiente (.)">▶</button>
            <span id="cineTime" class="mono">0.0 s</span>
          </div>
          <div id="usReadout" class="us-readout"></div>
        </section>

        <section id="paneInfo" class="pane tabs">
          <div class="tab-buttons" id="tabButtons">
            <button data-tab="case" class="active">Caso</button>
            <button data-tab="metrics">Punción</button>
            <button data-tab="measures">Mediciones</button>
            <button data-tab="ergo">Ergonomía</button>
            <button data-tab="lessons">Lecciones</button>
          </div>
          <div class="tab-content" id="tab-case"></div>
          <div class="tab-content hidden" id="tab-metrics"></div>
          <div class="tab-content hidden" id="tab-measures"></div>
          <div class="tab-content hidden" id="tab-ergo"></div>
          <div class="tab-content hidden" id="tab-lessons"></div>
        </section>

        <section id="paneAnat" class="pane">
          <div class="pane-title">
            <span>Anatomía real en el plano de corte</span>
            <label class="chk small"><input type="checkbox" id="anatLabels" checked />Nombres</label>
          </div>
          <div id="anatView" class="gl-view"><svg id="anatSvg"></svg></div>
          <div id="anatLegend" class="legend"></div>
        </section>
      </main>

      <footer id="console"></footer>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
