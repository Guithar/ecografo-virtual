<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simulador virtual de ecografía para la punción ecoguiada de fístulas arteriovenosas de hemodiálisis." />
    <title>Ecógrafo Virtual · Punción ecoguiada de FAV</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101820'/%3E%3Cpath d='M14 18h36l-6 30H20z' fill='%233fc1c9' opacity='.35'/%3E%3Ccircle cx='32' cy='33' r='8' fill='none' stroke='%239fe7ff' stroke-width='3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loadingText">Preparando el simulador…</div>
    </div>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
            <rect x="1" y="1" width="38" height="38" rx="9" fill="#12303a" />
            <path d="M8 11h24l-4 20H12z" fill="#3fc1c9" opacity=".35" />
            <circle cx="20" cy="20" r="5" fill="none" stroke="#9fe7ff" stroke-width="2" />
            <rect x="14" y="5" width="12" height="5" rx="1.5" fill="#e9edf1" />
          </svg>
          <div>
            <div class="title">Ecógrafo Virtual</div>
            <div class="subtitle">Punción ecoguiada de FAV</div>
          </div>
        </div>
        <div class="case-sel">
          <label for="caseSelect">Caso</label>
          <select id="caseSelect"></select>
          <span id="caseDiff" class="diff"></span>
        </div>
        <nav id="modeTabs">
          <button data-mode="explore" class="active" title="Explorar libremente la anatomía y el ecógrafo">Exploración</button>
          <button data-mode="cannulate" title="Punción ecoguiada con métricas">Punción</button>
          <button data-mode="room" title="Posición del paciente, operador y pantalla">Sala y ergonomía</button>
          <button data-mode="learn" title="Lecciones guiadas">Aprendizaje</button>
        </nav>
        <div class="top-actions">
          <select id="armSide" title="Brazo del acceso">
            <option value="left">Brazo izquierdo</option>
            <option value="right">Brazo derecho</option>
          </select>
          <select id="quality" title="Calidad de simulación">
            <option value="alta">Calidad alta</option>
            <option value="media" selected>Calidad media</option>
            <option value="baja">Calidad baja</option>
          </select>
          <button id="btnReport" title="Informe de la sesión">Informe</button>
          <button id="btnHelp" title="Ayuda y atajos de teclado">Ayuda</button>
        </div>
      </header>

      <main id="grid">
        <section id="pane3d" class="pane">
          <div id="view3d" class="gl-view" tabindex="0"></div>
          <div class="toolbar3d">
            <div class="btn-row" id="camPresets">
              <button data-cam="procedimiento" title="Vista del procedimiento">Procedimiento</button>
              <button data-cam="superior" title="Desde arriba">Superior</button>
              <button data-cam="lateral" title="Lateral">Lateral</button>
              <button data-cam="corte" title="Perpendicular al plano de corte">Corte</button>
              <button data-cam="operador" title="Lo que ve el operador">Operador</button>
              <button data-cam="sala" title="Vista general de la sala">Sala</button>
            </div>
            <div class="btn-row" id="layerRow">
              <label class="sl" title="Transparencia de la piel">Piel <input type="range" id="optSkin" min="0" max="1" step="0.01" /></label>
              <label class="chk"><input type="checkbox" id="optVessels" checked />Vasos</label>
              <label class="chk"><input type="checkbox" id="optNerves" checked />Nervios</label>
              <label class="chk"><input type="checkbox" id="optBones" checked />Huesos</label>
              <label class="chk"><input type="checkbox" id="optTendons" checked />Tendones</label>
              <label class="chk"><input type="checkbox" id="optMuscle" />Músculo</label>
              <label class="chk"><input type="checkbox" id="optFlow" />Flujo</label>
              <label class="chk" title="La cámara acompaña a la sonda"><input type="checkbox" id="optFollow" checked />Seguir sonda</label>
              <select id="optPlane" title="Contenido del plano de exploración en 3D">
                <option value="us">Plano: ecografía</option>
                <option value="anat">Plano: anatomía</option>
                <option value="none">Plano: oculto</option>
              </select>
            </div>
          </div>
          <div id="probeHud" class="hud"></div>
          <div id="needleHud" class="hud hud-right hidden"></div>
          <div id="toasts"></div>
          <div class="pane-hint" id="hint3d">Arrastra la <b>sonda</b> sobre la piel para moverla · arrastra el fondo para girar la cámara · rueda para acercar</div>
        </section>

        <section id="paneMonitor" class="pane monitor">
          <div class="mon-top">
            <span class="mon-brand">EcoSim<b>FAV</b></span>
            <span id="monCase" class="mon-case"></span>
            <span class="grow"></span>
            <span class="mon-probe">L12-5 · 38 mm</span>
            <span id="monClock" class="mon-clock"></span>
          </div>
          <div class="mon-body">
            <div id="usView" class="gl-view us-view">
              <svg id="usSvg"></svg>
              <div id="usParams"></div>
            </div>
            <div id="specView" class="spec hidden">
              <canvas id="specCanvas"></canvas>
            </div>
            <div id="specMeas" class="spec-meas"></div>
          </div>
          <div id="cineBar" class="cine hidden">
            <span>Cine</span>
            <button id="cinePrev" title="Fotograma anterior (,)">◀</button>
            <input type="range" id="cineSlider" min="0" max="63" step="1" />
            <button id="cineNext" title="Fotograma siguiente (.)">▶</button>
            <span id="cineTime" class="mono">0.0 s</span>
          </div>
          <div id="usReadout" class="us-readout"></div>
        </section>

        <section id="paneInfo" class="pane tabs">
          <div class="tab-buttons" id="tabButtons">
            <button data-tab="case" class="active">Caso</button>
            <button data-tab="metrics">Punción</button>
            <button data-tab="measures">Mediciones</button>
            <button data-tab="ergo">Ergonomía</button>
            <button data-tab="lessons">Lecciones</button>
          </div>
          <div class="tab-content" id="tab-case"></div>
          <div class="tab-content hidden" id="tab-metrics"></div>
          <div class="tab-content hidden" id="tab-measures"></div>
          <div class="tab-content hidden" id="tab-ergo"></div>
          <div class="tab-content hidden" id="tab-lessons"></div>
        </section>

        <section id="paneAnat" class="pane">
          <div class="pane-title">
            <span>Anatomía real en el plano de corte</span>
            <label class="chk small"><input type="checkbox" id="anatLabels" checked />Nombres</label>
          </div>
          <div id="anatView" class="gl-view"><svg id="anatSvg"></svg></div>
          <div id="anatLegend" class="legend"></div>
        </section>
      </main>

      <footer id="console"></footer>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
