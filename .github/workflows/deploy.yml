name: Publicar en fistulab.com (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  indexnow:
    # Avisa a Bing (y a Yandex, Seznam… por IndexNow) de que las páginas han cambiado.
    # La clave es pública: el buscador la comprueba en https://fistulab.com/<clave>.txt (public/).
    # Si el aviso falla, la publicación sigue siendo válida: sólo queda una advertencia.
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    env:
      INDEXNOW_KEY: ca074bea9d312bfccd4a87f032b624a8
    steps:
      - name: Avisar a IndexNow
        run: |
          # todas las páginas del sitemap recién publicado (simulador y guías, en los dos idiomas)
          urls=$(curl -sS "https://fistulab.com/sitemap.xml?t=$(date +%s)" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | sed 's/.*/"&"/' | paste -sd, -)
          [ -n "$urls" ] || urls='"https://fistulab.com/","https://fistulab.com/en/"'
          echo "URL: $urls"
          status=$(curl -sS -o respuesta.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"fistulab.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://fistulab.com/$INDEXNOW_KEY.txt\",\"urlList\":[$urls]}") || status=000
          echo "IndexNow: HTTP $status"
          cat respuesta.txt 2>/dev/null || true
          case "$status" in
            200|202) ;;
            *) echo "::warning::IndexNow respondió HTTP $status" ;;
          esac
